# gitleaks configuration
#
# Default rules are used as-is; this file only carves out exceptions, so the
# scan stays as strict as possible everywhere else.

title = "Local API Vault — gitleaks config"

[extend]
useDefault = true

[allowlist]
description = """
Deliberate false positives in the redaction test suite.

`src-tauri/src/redact.rs` contains fake credentials used to prove that the
"复制参考资料" feature masks credentials appearing in an entry's notes. The
tests assert these values are ABSENT from the rendered output, so their presence
in the source is the point — they are detection decoys, not leaked credentials.

Scanned against gitleaks 8.30.1; these are exactly the two values it flags.

Scoped to the exact literals rather than the whole file, so any *other* secret
introduced into redact.rs is still caught.
"""
regexes = [
  # `masks_assigned_secrets_in_notes` — notes containing `token=...`
  '''abc123secret456''',
]