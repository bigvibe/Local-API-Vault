name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local API Vault ${{ github.ref_name }}
          releaseBody: |
            Local API Vault release.

            This build is currently unsigned. Verify the checksum and do not store your only copy of production credentials in an unaudited build.
          releaseDraft: true
          prerelease: false
          # `-- --locked` (note the separator) forwards --locked to cargo.
          # `tauri build` has no --locked flag of its own; everything after a
          # bare `--` is passed through to the runner.
          args: --bundles nsis -- --locked
