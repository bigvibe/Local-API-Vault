name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          # Required as of tauri-action v1. v0 picked the token up implicitly;
          # v1 fails with "GITHUB_TOKEN is required" if this is missing.
          # The workflow-level `permissions: contents: write` above is what
          # gives this token its write scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local API Vault ${{ github.ref_name }}
          releaseBody: |
            Local API Vault release.

            This build is currently unsigned. Verify the checksum and do not store your only copy of production credentials in an unaudited build.
          releaseDraft: true
          prerelease: false
          # `-- --locked` (note the separator) forwards --locked to cargo.
          # `tauri build` has no --locked flag of its own; everything after a
          # bare `--` is passed through to the runner.
          args: --bundles nsis -- --locked
