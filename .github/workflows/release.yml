name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          # Required as of tauri-action v1. v0 picked the token up implicitly;
          # v1 fails with "GITHUB_TOKEN is required" if this is missing.
          # The workflow-level `permissions: contents: write` above is what
          # gives this token its write scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local API Vault ${{ github.ref_name }}
          releaseBody: |
            Local API Vault ${{ github.ref_name }}

            一个完全离线的本地 API 密钥保险箱：不上云、不注册、不联网。

            ### 安装
            1. 下载下方的 `_x64-setup.exe` 并双击安装（当前用户目录，无需管理员权限）
            2. 打开应用，创建 Vault 并设置主密码
            3. 主密码无法找回，界面给出的恢复身份文件请离线保存

            装完后可用 `lvault get <条目名>`。该命令已加入 PATH，但只对新开的终端生效。

            ### Windows 会提示「未知发布者」
            本项目尚未购买代码签名证书，SmartScreen 会拦截，这是预期行为而非感染。
            可点「更多信息 → 仍要运行」跳过。GitHub 在资产下方提供 SHA-256，可自行比对。

            ### 已知限制
            - 尚未完成独立安全审计，加密文件格式在 0.1.x 内可能继续演进
            - 目前仅支持 Windows

            请不要在审计完成前，把唯一的高价值生产凭据交给它。

            许可证：Apache-2.0
          releaseDraft: true
          prerelease: false
          # `-- --locked` (note the separator) forwards --locked to cargo.
          # `tauri build` has no --locked flag of its own; everything after a
          # bare `--` is passed through to the runner.
          args: --bundles nsis -- --locked
