name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 03:17 UTC. GitHub disables scheduled workflows on
    # repositories with no activity for 60 days, so commit to the repo or this
    # will silently stop running.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Rust is the security-critical part of this project (vault format,
        # crypto wrappers, the Named Pipe bridge). JavaScript is the Tauri
        # frontend, which only renders and calls local commands.
        language: [rust, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # NOTE: the input is `languages` (plural) as of codeql-action v3.
          # v2 had a singular `language`; using that name here silently fails
          # the step. The action's own docs recommend passing
          # `${{ matrix.language }}` as the value of `languages`, which is
          # exactly what this does.
          languages: ${{ matrix.language }}
          # Rust has no build-mode tracing, and the frontend is plain
          # unbundled JavaScript, so `none` is correct and avoids the
          # autobuild step failing on a Tauri project.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'