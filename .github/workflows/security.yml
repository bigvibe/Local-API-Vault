name: Security

# Kept separate from CI on purpose. CI answers "does it still build and pass
# tests"; this answers "does it still look safe". A new CVE turning this red
# should not make it ambiguous whether the code itself is broken.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked files and history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          # Scans the full history too, so a secret committed and removed in a
          # later commit is still caught. `--config` honours .gitleaks.toml,
          # which exempts exactly one decoy token in the redaction test suite.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: '--config .gitleaks.toml --redact --verbose'

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # cargo-audit is not in the action's built-in tool list, so it falls back to
      # cargo-binstall, which fetches a prebuilt binary. Compiling it from
      # source via `cargo install` adds ~7 minutes to every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Deliberately plain `cargo audit` rather than rustsec/audit-check.
      # audit-check sets its failure flag for warnings as well as
      # vulnerabilities, so the six `unmaintained` warnings from Tauri's
      # i18n dependency chain turn the whole job red — and a permanently red
      # Security badge is worse than no badge, because people learn to ignore it.
      #
      # Plain cargo audit exits 0 on warnings and non-zero on real
      # vulnerabilities, which is the signal we actually want. It also means we
      # do not have to enumerate RUSTSEC ids in an `ignore` list, which would
      # go stale and would also mask a crate that RustSec later reclassifies
      # from unmaintained to unsound.
      #
      # Baseline 2026-10-15: 0 vulnerabilities. See the audit note above.
      - name: Audit dependencies against the RustSec advisory database
        run: cargo audit
        working-directory: src-tauri

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high